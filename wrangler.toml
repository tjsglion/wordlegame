"$schema" = "./node_modules/wrangler/config-schema.json"
name = "wordlegame"
main = "worker.js"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"
APP_ORIGIN = "https://wordlegame.app"
AUTH_URL = "https://wordlegame.app"
AUTH_TRUST_HOST = "true"
AUTH_GOOGLE_ID = "798203036146-c8fp38cbagd2segged3s4ll4gd3htogr.apps.googleusercontent.com"
AUTH_GITHUB_ID = "Ov23liWhm4UXsReplcOV"

[[routes]]
pattern = "wordlegame.app"
custom_domain = true

[[routes]]
pattern = "www.wordlegame.app"
custom_domain = true

[triggers]
crons = ["5 0 * * *"]
